name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test-py3XX vary Python (3.10 also means pandas 2: pandas 3 needs 3.11+).
        # test-pandas2 pins pandas 2 on a current Python, since string dtypes differ most
        # between pandas 2 and 3. test-nopyarrow drops the optional pyarrow cells.
        environment:
          - test-py310
          - test-py311
          - test-py312
          - test-py313
          - test-pandas2
          - test-nopyarrow

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Setup pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.environment }}
          frozen: true

      - name: Run tests with coverage
        run: pixi run -e ${{ matrix.environment }} test-cov
