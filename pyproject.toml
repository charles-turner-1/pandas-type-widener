[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"


[project]
name = "pandas-type-widener"
version = "0.1.0.dev0"
description = "A pytest plugin that discovers which pandas dtypes a library really accepts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Charle Turner", email = "charles.turner@anu.edu.au" }]
maintainers = [{ name = "Charle Turner", email = "charles.turner@anu.edu.au" }]
license = { text = "Apache Software License 2.0" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "hypothesis>=6.100", # value generation within a dtype
    "pandas>=2.1",       # DataFrame.isetitem, StringDtype storage options
    "pytest>=8.0",       # new-style hook wrappers
]

[project.optional-dependencies]
# pyarrow only adds grid cells (``string[pyarrow]``); nothing requires it.
pyarrow = ["pyarrow"]
dev = [
    "black",
    "coverage",
    "hypothesis",
    "mypy",
    "pyarrow",
    "pytest",
    "pytest-xdist", # testing: results must survive the trip from worker to controller
    "ruff",
]

[project.entry-points.pytest11]
# Loaded automatically once installed, but inert until ``--widen`` (or the
# ``widen_targets`` ini option) names something to probe.
pandas_type_widener = "pandas_type_widener.plugin"

[project.urls]
bugs = "https://github.com/charles-turner-1/pandas-type-widener/issues"
homepage = "https://github.com/charles-turner-1/pandas-type-widener"

[tool.hatch.build.targets.wheel]
packages = ["src/pandas_type_widener"]


# Mypy
# ----

[tool.mypy]
files = "src"
strict = true
warn_unreachable = true
warn_no_return = true
allow_subclassing_any = true

[[tool.mypy.overrides]]
# pandas ships no inline types; pandas-stubs is deliberately not pulled in, since the
# code here mostly passes frames through rather than computing with them.
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pandas_type_widener"]

[tool.ruff]
target-version = "py310"
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", ".pixi", "build", "dist", "tests"]

[tool.ruff.lint]
# E501: line too long - black owns wrapping
# D105: magic methods carry their meaning in the name
# D205: black owns the wrapping of multi-sentence summaries
# UP038: isinstance(x, X | Y) -- deprecated in ruff itself (slower, no clearer), but the
#        older ruff pinned in pre-commit still enforces it
ignore = ["E501", "D105", "D205", "UP038"]
select = ["F", "E", "W", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["pandas_type_widener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``pytester`` drives the plugin end to end against tests/toylib.
addopts = "-p pytester"

[tool.numpydoc_validation]
checks = [
    "GL06", # unknown section
    "GL07", # sections in the wrong order
    "GL08", # object has no docstring
    "SS01", # no summary
    "SS02", # summary starts lowercase
    "SS03", # summary doesn't end in a period
    "SS05", # summary starts with a third-person verb ("Returns" -> "Return")
    "PR01", # parameters not documented
    "PR02", # documented parameters that don't exist
    "PR03", # parameters documented out of signature order
    "PR07", # parameter has no description
    "RT01", # no Returns section where a value is returned
    "RT03", # return value has no description
]
exclude = [
    '\.__init__$',     # class docstrings document constructor parameters
    '\.pytest_',       # pytest hook implementations: the hookspec documents them
    '\._[^.]+(\.|$)', # private helpers, and anything nested in them, need a summary at most
]


# Pixi
# ----

[tool.pixi.workspace]
channels = ["conda-forge"]
name = "pandas-type-widener"
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pandas = ">=2.1"
hypothesis = ">=6.100"
pytest = ">=8.0"

[tool.pixi.pypi-dependencies]
pandas-type-widener = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev", "test", "pyarrow"], solve-group = "default" }
test-py310 = { features = ["py310", "test", "pyarrow"] } # pandas 2.x: pandas 3 needs 3.11
test-py311 = { features = ["py311", "test", "pyarrow"] }
test-py312 = { features = ["py312", "test", "pyarrow"] }
test-py313 = { features = ["py313", "test", "pyarrow"] }
# pandas 2 on a current Python: the string-dtype defaults differ most between 2 and 3.
test-pandas2 = { features = ["py313", "pandas2", "test", "pyarrow"] }
# pyarrow is optional: without it the grid loses ``string[pyarrow]`` and nothing else.
test-nopyarrow = { features = ["test"] }

[tool.pixi.feature.test.dependencies]
coverage = "*"
pytest-xdist = "*"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", description = "Run tests" }
test-cov = { cmd = "coverage run -m pytest && coverage xml", description = "Run tests with coverage and write coverage.xml" }

[tool.pixi.feature.pyarrow.dependencies]
pyarrow = "*"

[tool.pixi.feature.pandas2.dependencies]
pandas = ">=2.1,<3"

[tool.pixi.feature.dev.dependencies]
pre-commit = ">=4.2.0,<5"
ruff = "*"
black = "*"
mypy = "*"

[tool.pixi.feature.dev.tasks]
ruff = { cmd = "ruff check src", description = "Run ruff checks" }
black = { cmd = "black src tests", description = "Run the black formatter" }
mypy = { cmd = "mypy", description = "Run mypy type checks (config: [tool.mypy])" }
pre-commit = { cmd = "pre-commit run --all-files", description = "Run pre-commit hooks" }
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit hooks" }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
